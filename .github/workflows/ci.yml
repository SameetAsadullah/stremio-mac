name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard runners are free for public repositories. Larger runners are billed.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: make lint

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Cache Node.js
        uses: actions/cache@v6
        with:
          path: Vendor/node
          key: node-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: Bootstrap
        run: make bootstrap

      - name: Build
        run: make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"

      - name: Test
        run: make test XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"
